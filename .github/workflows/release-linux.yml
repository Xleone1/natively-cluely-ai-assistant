name: Release (Linux AppImage + deb)

# Builds a Linux release (AppImage + deb) for x64 via electron-builder --linux.
# Single-arch (x64) to match package.json build.linux and the native-module
# artifact map (index.linux-x64-gnu.node). Arm64/Arm can be added once
# native-module cross-compile + electron-builder linux arm targets are validated.
#
# Mirrors release-macos.yml's credential/artifact shape but without signing/
# notarization — Linux artifacts are not code-signed. Publishing attaches
# AppImage + deb + latest-linux.yml to the GitHub Release on tag builds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual trigger uses selected ref in the Actions UI

permissions:
  contents: write # needed to upload release assets + publish latest-linux.yml

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Detect submodule token
        id: submodule_token
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.GH_APP_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [ -n "${SUBMODULE_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$REPO_OWNER" != "Natively-AI-assistant" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork release without premium — building core (no premium) for Linux validation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::A SUBMODULE_TOKEN or GH_APP_TOKEN with access to Natively-AI-assistant/natively-premium is required for a release build."
            exit 1
          fi

      - name: Checkout premium submodule
        if: steps.submodule_token.outputs.available == 'true'
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.GH_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git -c url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf="https://github.com/" \
              submodule update --init --force -- premium
          test -f premium/electron/knowledge/CompanyResearchEngine.ts

      - name: Install Linux system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libdbus-1-dev libsecret-1-dev \
            libvips-dev libsqlite3-dev \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust (native module)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: "skip"
        run: npm ci

      - name: Build
        run: |
          set -euo pipefail
          npm run build
          if [ "${{ steps.submodule_token.outputs.available }}" = "true" ]; then
            npm run build:electron
          else
            npm run build:electron:core-smoke
          fi

      - name: Build native module (linux x64)
        run: |
          set -euo pipefail
          npm run build:native
          test -f native-module/index.linux-x64-gnu.node
          echo "Native artifact present:"
          ls -lh native-module/index.linux-x64-gnu.node
          ldd native-module/index.linux-x64-gnu.node | head -20 || true

      - name: Ensure Linux sharp deps
        run: node scripts/ensure-sharp-linux-deps.js || echo "ensure-sharp-linux-deps skipped/failed but non-fatal for this build"

      - name: Ensure sqlite-vec
        run: node scripts/ensure-sqlite-vec.js

      - name: Verify packaged local fallback assets (source mode)
        run: npm run verify:packaged-local-assets -- --include-linux || npm run verify:packaged-local-assets

      - name: Build Linux packages (AppImage + deb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          xvfb-run -a ./node_modules/.bin/electron-builder --linux --publish never
          echo "Artifacts:"
          ls -lh release/*.AppImage release/*.deb release/latest-linux.yml 2>&1 | head -30

      - name: Verify packaged local fallback assets (per artifact)
        run: |
          set -euo pipefail
          # electron-builder's --linux --dir would unpack to release/linux-unpacked;
          # our config produces AppImage+deb, so verify the source tree is still the gate.
          # A per-app --app verify would require extracting the AppImage — out of scope for v1.
          node scripts/verify-packaged-local-assets.mjs --include-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natively-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
